<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- JARVIS: the arc reactor, frozen on a tile. The live one (HUD, charge, turbine) is static/js/logo.js;
       tests/make_icons.py renders this drawing to PNG / .ico / .icns. -->
  <defs>
    <radialGradient id="tile" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#11233a"/><stop offset=".55" stop-color="#070e17"/><stop offset="1" stop-color="#020407"/></radialGradient>
    <radialGradient id="amb"><stop offset="0" stop-color="#72c9ff" stop-opacity=".30"/><stop offset=".5" stop-color="#72c9ff" stop-opacity=".07"/><stop offset="1" stop-color="#72c9ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="coil" cx="0" cy="0" r="19.4" gradientUnits="userSpaceOnUse"><stop offset=".62" stop-color="#e6f7ff"/><stop offset=".8" stop-color="#72c9ff"/><stop offset="1" stop-color="#1c7fd6"/></radialGradient>
    <radialGradient id="core" cx=".44" cy=".4" r=".64"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#e6f7ff"/><stop offset=".8" stop-color="#72c9ff"/><stop offset="1" stop-color="#3aa6f0"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#e6f7ff" stop-opacity=".95"/><stop offset=".42" stop-color="#72c9ff" stop-opacity=".42"/><stop offset="1" stop-color="#72c9ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="-22" y1="-24" x2="20" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d2dde8"/><stop offset=".28" stop-color="#63768b"/><stop offset=".55" stop-color="#1b2531"/><stop offset=".78" stop-color="#52657a"/><stop offset="1" stop-color="#a9b9ca"/></linearGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation=".9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#8fd4ff" stroke-opacity=".22"/>
  <g transform="translate(32 32) scale(1.12)" fill="none">
    <circle r="30" fill="url(#amb)"/>
    <circle r="24.9" stroke="#9fdcff" stroke-width=".35" opacity=".45"/>
    <circle r="23" stroke="url(#metal)" stroke-width="3.6"/>
    <g fill="#0b131c" stroke="#a9b9ca" stroke-width=".35">
      <circle cx="16.263" cy="-16.263" r=".95"/><circle cx="16.263" cy="16.263" r=".95"/>
      <circle cx="-16.263" cy="16.263" r=".95"/><circle cx="-16.263" cy="-16.263" r=".95"/>
    </g>
    <circle r="21.1" stroke="#72c9ff" stroke-width=".5" opacity=".6"/>
    <g fill="url(#coil)" stroke="#d9f4ff" stroke-width=".35" stroke-opacity=".7" opacity=".92" filter="url(#bloom)">
      <path id="c" d="M-4.199 -18.940A19.4 19.4 0 0 1 4.199 -18.940L2.188 -12.409A12.6 12.6 0 0 0 -2.188 -12.409Z"/>
      <use href="#c" transform="rotate(36)"/><use href="#c" transform="rotate(72)"/><use href="#c" transform="rotate(108)"/>
      <use href="#c" transform="rotate(144)"/><use href="#c" transform="rotate(180)"/><use href="#c" transform="rotate(216)"/>
      <use href="#c" transform="rotate(252)"/><use href="#c" transform="rotate(288)"/><use href="#c" transform="rotate(324)"/>
    </g>
    <circle r="11" stroke="#04101a" stroke-width="1.4"/>
    <circle r="14" fill="url(#halo)"/>
    <circle r="8.6" fill="url(#core)" filter="url(#bloom)"/>
    <circle r="5" stroke="#fff" stroke-width=".6" opacity=".5"/>
    <ellipse cx="-2.7" cy="-3.1" rx="1.9" ry="1.3" fill="#fff" opacity=".75" transform="rotate(-35 -2.7 -3.1)"/>
  </g>
</svg>
